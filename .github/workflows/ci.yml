name: CI

on:
  push:
  pull_request:

jobs:
  host:
    # Package.swift declares swift-tools-version 6.0; macos-14 images ship
    # Swift 5.10 and refuse to load the manifest.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        working-directory: host/macos
        run: swift test

  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shared client tests
        run: python -m unittest discover -s adapters/shared/tests -v
      - name: Claude adapter tests
        run: python -m unittest discover -s adapters/claude/tests -v
      - name: Codex adapter tests
        run: python -m unittest discover -s adapters/codex/tests -v
      - name: Gemini adapter tests
        run: python -m unittest discover -s adapters/gemini/tests -v
      - name: Antigravity adapter tests
        run: python -m unittest discover -s adapters/antigravity/tests -v
      - name: Syntax check
        run: >-
          python -m py_compile
          adapters/shared/keycap_client.py
          adapters/claude/keycap_hook.py
          adapters/codex/keycap_hook.py
          adapters/codex/app_server_adapter.py
          adapters/codex/app_server_bridge.py
          adapters/gemini/keycap_hook.py
          adapters/generic/stdin_adapter.py
          adapters/antigravity/keycap_hook.py

  firmware:
    runs-on: ubuntu-latest
    container: ghcr.io/zephyrproject-rtos/ci:latest
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
    steps:
      - uses: actions/checkout@v4
        with:
          path: keycap-context
      - name: Locate the Zephyr SDK
        # The image registers its SDK in CMake's package registry under the
        # image's own HOME, which is not the HOME a container job runs with, so
        # the registry lookup misses it. Find the SDK instead of hardcoding a
        # version that goes stale on the next image bump.
        run: |
          sdk=$(find /opt /usr/local "$HOME" -maxdepth 3 -type d \
                     -name 'zephyr-sdk-*' 2>/dev/null | sort -V | tail -1)
          if [ -z "$sdk" ]; then
            echo "No Zephyr SDK in the container image" >&2
            exit 1
          fi
          echo "Using SDK at $sdk"
          echo "ZEPHYR_SDK_INSTALL_DIR=$sdk" >> "$GITHUB_ENV"
      - name: Initialize a Zephyr workspace
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr main workspace
          cd workspace && west update --narrow -o=--depth=1
      - name: Protocol and framing ztests
        working-directory: workspace
        run: west twister -T ../keycap-context/firmware/tests -p native_sim --inline-logs
