CONFIG_I2C=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_LOG=n
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ASSERT=y

# Audio-reactive lighting: the on-board PDM microphone.
# Samples are analysed on the device and never reach the host; the link could
# not carry them anyway, at 32 kB/s of PCM against a 11.5 kB/s serial budget.
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y
